<!DOCTYPE html>
<html>
<head>
<style>
    body {
        font-size: 18px;
        font-family: sans-serif;
    }
    form label {
        display: block;
    }
    form input[type="submit"] {
        display: block;
        margin-top: 40px;
    }
</style>
</head>
<body>
<h1>Exercise 1: Facebook</h1>

<div style="width:300px">
    <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png" height="100" alt="Facebook Logo">

    <p>Facebook, Inc. is an American online social media and social networking service company. It is based in Menlo Park, California.</p>
    <a href="https://en.wikipedia.org/wiki/Facebook">For more click here</a>
</div>

<form>
    <label>Name:</label>
    <input type="text" placeholder="Enter your Name">

    <label>Age:</label>
    <input type="text" placeholder="20">

    <label>Gender:</label>
    <input type="radio" name="gender" value="male" checked> Male<br>
    <input type="radio" name="gender" value="female"> Female
   
    <input type="submit" value="Signup">
</form>
</body>
</html>
